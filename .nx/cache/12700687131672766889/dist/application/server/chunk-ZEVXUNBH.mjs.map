<div class="resume-card">
  <div class="resume-info-wrapper">
    <span class="material-symbols-outlined icon-blue">description</span>
    <div class="resume-info-text">
      <div class="resume-title">{{ resume.personalInfo.jobTitle }}</div>
    </div>
  </div>
  <div class="updatedat">Updated at {{ resume.meta.updatedAt | date : 'dd.MM.yyyy' }}</div>
  <div class="resume-btns">
    <button class="edit-btn" [routerLink]="['/application/resumes', resume.id, 'edit']">Edit</button>
    <button class="tailor-btn" [routerLink]="['/application/resumes', resume.id, 'tailor']">AI Tailor</button>
    <button class="delete-btn" (click)="deleteResume()">
      <span class="material-symbols-outlined resume-mat delete-btn">Delete</span>
    </button>
  </div>
</div>
