<div class="pricing" [class.popular]="popular">
  <div class="card-content">
    <div class="card-price">
      @if (popular) {
        <div class="badge">Most Popular</div>
      }

      <h3 class="plan-name">{{ plan.name }}</h3>

      <p class="price">
        ${{ plan.price }}@if (plan.name != 'Premium') {
        <span>/month</span>
      }
      @if (plan.name == 'Premium') {
        <span>/month</span>
      }
    </p>
  </div>

  <ul class="features">
    @for (feature of plan.features; track feature.text) {
      <li [class.excluded]="!feature.included" [class.included]="feature.included">{{ feature.text }}</li>
    }
  </ul>
</div>

<button
  type="button"
  [class.btn-filled]="popular"
  [class.btn-outline]="!popular"
  [disabled]="disabled"
  (click)="onSelectPlan()"
>
  {{ plan.button }}
</button>
</div>
