<section class="hero" id="hero" #hero>
  <div class="wrapper">
    <div class="main-text">
      <h1 class="title">
        Create Your Perfect Resume <br>
        <span class="blue-text">In Just 5 Minutes</span>
      </h1>

      <p class="description">
        Stop struggling with blank pages. Let AI write your resume based on your experience and
        target job. Get more interviews, guaranteed.
      </p>
    </div>

    <app-landing-cta
      [link]="['/application/dashboard']"
      icon="auto_awesome"
      label="Create My Resume Now"
      [helperTexts]="['No Credit Card Required', 'Ready in 5 Minutes']"
      ariaLabel="Create My Resume Now"
    ></app-landing-cta>

    <div class="picture">
      <img src="assets/photo-1586281380349-632531db7ed4.jpg" alt="resume" />
    </div>
  </div>

  <button
    type="button"
    class="scroll-down-btn"
    (click)="scrollTo('features')"
    aria-label="Scroll down to features section"
  >
    <span class="scroll-down-text">Scroll down!</span>
    <span class="scroll-down-arrow" aria-hidden="true">v</span>
  </button>
</section>
