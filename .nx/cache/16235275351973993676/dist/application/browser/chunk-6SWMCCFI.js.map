<section class="pricing" id="pricing" #pricing_plans>
  <div class="wrapper">
    <header class="head">
      <h2 class="title">Complete Pricing Plans</h2>
      <p class="sub-title">Everything you need to accelerate your career</p>
    </header>
    <div class="pricing-cards">
      @for (plan of plans; track plan.name) {
      <app-pricing-card
        [plan]="plan"
        [planSlug]="plan.planSlug"
        [popular]="plan.popular"
        [disabled]="loading$ | async"
        class="pricing-card"
      >
      </app-pricing-card>
      }
    </div>

    <app-landing-cta
      class="section-cta"
      [link]="['/application/dashboard']"
      icon="workspace_premium"
      label="Start Building My Resume"
      [helperTexts]="ctaHelperTexts"
      ariaLabel="Start Building My Resume"
    ></app-landing-cta>
  </div>
</section>
