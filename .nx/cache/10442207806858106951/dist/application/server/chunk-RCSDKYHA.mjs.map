<div class="settings container">
  <app-dir-name title="Settings"></app-dir-name>
  <div class="app-section">
    <div class="profile-info">
      <h3 class="section-title">Profile Information</h3>
      <form class="profile-info_form">
        <div class="form-item">
          <label for="name">Full Name</label>
          <input type="text" class="name-input input" name="name" value="{{ user()?.name }}" />
        </div>
        <div class="form-item">
          <label for="email">Email</label>
          <input type="email" class="email-input input" name="email" value="{{ user()?.email }}" />
        </div>
      </form>
      <button mat-button class="primary-btn" (click)="onSave()">Save Changes</button>
    </div>
    <div class="subscription">
      <div class="plan-info">
        <h3 class="section-title">Subscription</h3>
        <div class="plan">
          <h4 class="plan-name">{{ user()?.plan }} plan</h4>
        </div>
      </div>
      <button
        mat-button
        class="manage-btn"
        [disabled]="managingSubscription()"
        (click)="onManageSubscription()"
      >
        {{ managingSubscription() ? 'Opening...' : 'Manage Subscription' }}
      </button>
    </div>
    <div class="danger-zone">
      <h3 class="section-title">Danger Zone</h3>
      <div class="danger-btns">
        <button class="delete-account-btn" (click)="onDeleteAccount()">Delete Account</button>
      </div>
    </div>
  </div>
</div>
