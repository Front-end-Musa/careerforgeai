<article
  class="resume-preview"
  [attr.data-template]="template.id"
  [attr.data-family]="template.family"
  [attr.data-context]="renderContext"
>
  @switch (template.renderer) {
    @case ('classic') {
      <app-classic-resume-renderer
        [resume]="resume"
        [template]="template"
        [renderContext]="renderContext"
      ></app-classic-resume-renderer>
    }
    @case ('modern') {
      <app-modern-resume-renderer
        [resume]="resume"
        [template]="template"
        [renderContext]="renderContext"
      ></app-modern-resume-renderer>
    }
    @case ('latex') {
      <app-latex-resume-renderer
        [resume]="resume"
        [template]="template"
        [renderContext]="renderContext"
      ></app-latex-resume-renderer>
    }
    @default {
      <app-premium-resume-renderer
        [resume]="resume"
        [template]="template"
        [renderContext]="renderContext"
      ></app-premium-resume-renderer>
    }
  }
</article>
