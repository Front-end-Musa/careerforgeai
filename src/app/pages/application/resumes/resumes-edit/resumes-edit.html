<app-resume-template-modal
  #templateModal
  [plan]="(plan$ | async) || 'free'"
  [user]="currentUser"
  [resumeCount]="resumeCount"
  [selectedTemplateId]="selectedTemplateId ?? null"
  (templateSelected)="onTemplateSelected($event)"
  (upgradeRequested)="handleTemplateUpgrade($event)"
></app-resume-template-modal>

<app-resumes-create
  mode="edit"
  [resumeId]="resumeId"
  [templateId]="selectedTemplateId"
  [plan]="(plan$ | async) || 'free'"
  [user]="currentUser"
  [resumeCount]="resumeCount"
  (changeTemplate)="openTemplateModal()"
  (saveCompleted)="handleResumeSaved()"
></app-resumes-create>
