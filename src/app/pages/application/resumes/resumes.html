<div class="resumes">
  <app-dir-name title="AI Resume Generator">
    <app-create-list-resume-switch
      [active]="viewMode"
      (change)="viewMode = $event"
    ></app-create-list-resume-switch>
  </app-dir-name>
  <div class="app-section">
    @if (viewMode === 'create') {
      <app-resumes-create></app-resumes-create>
    } @else {
      <app-resumes-list></app-resumes-list>
    }
  </div>
</div>
