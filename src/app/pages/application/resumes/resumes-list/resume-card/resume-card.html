<div class="resume-card">
  <div class="resume-image up"><img src="" alt="" /></div>
  <div class="resume-info-wrapper">
    <div class="resume-title">{{ resume.jobTitle }}</div>
    <div class="resume-info">{{ resume.tone }}  •  {{ resume.updatedAt | date : 'shortDate' }}</div>
    <div class="resume-btns">
      <button class="edit-btn">Edit</button>
      <button class="download-btn"><span class="material-symbols-outlined resume-mat">Download</span></button>
      <button class="delete-btn">
        <span class="material-symbols-outlined resume-mat delete-btn">Delete</span>
      </button>
    </div>
  </div>
</div>
