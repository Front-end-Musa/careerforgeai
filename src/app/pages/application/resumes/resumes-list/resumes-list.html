@if (status$ | async; as status) {
  @if (status === resumesStatus.Init) {
    <p>Initializing resumes...</p>
  }
  @if (status === resumesStatus.Loading) {
    <mat-progress-spinner diameter="30" mode="indeterminate"></mat-progress-spinner>
  }
  @if (status === resumesStatus.Loaded) {
    <div class="resumes-list-wrapper">
      <cdk-virtual-scroll-viewport itemSize="200" class="viewport">
        <div *cdkVirtualFor="let resume of resumes()" class="resume-card-wrapper">
          <app-resume-card [resume]="resume"></app-resume-card>
        </div>
      </cdk-virtual-scroll-viewport>
    </div>
  }
  @if (status === resumesStatus.Error) {
    <p>Error loading resumes.</p>
  }
}
