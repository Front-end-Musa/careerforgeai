<div class="modal-shell">
  <div class="modal-header">
    <div>
      <p class="modal-eyebrow">Job Tracker</p>
      <h2>{{ modalMode === 'add' ? 'Add New Job' : 'Edit Job' }}</h2>
      <p class="modal-subtitle">
        Track applications with the same polished form patterns used across the app.
      </p>
    </div>
    <button class="close-btn" type="button" (click)="closeModal()" aria-label="Close modal">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="jobForm" (ngSubmit)="onSubmit()">
    <div class="modal-body">
      <div class="form-group">
        <label for="title">Job Title</label>
        <input
          id="title"
          type="text"
          formControlName="title"
          placeholder="e.g. Senior Frontend Developer"
          required
        />
      </div>

      <div class="form-group">
        <label for="company">Company</label>
        <input
          id="company"
          type="text"
          formControlName="company"
          placeholder="e.g. Tech Corp"
          required
        />
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" formControlName="status" required>
          <option value="">Select Status</option>
          <option value="applied">Applied</option>
          <option value="interviewing">Interviewing</option>
          <option value="offered">Offered</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>

      <div class="form-group">
        <cf-date-field
          formControlName="dateApplied"
          label="Applied Date"
          placeholder="Select application date"
          [required]="true"
          mode="date"
        ></cf-date-field>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-secondary" (click)="closeModal()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="jobForm.invalid">
        {{ modalMode === 'add' ? 'Add Job' : 'Save Changes' }}
      </button>
    </div>
  </form>
</div>
