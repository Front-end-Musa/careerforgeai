<div class="sidebar" [class.open]="isSidebarOpen">
  <div class="sidebar-list">
    <div class="logo-container">
      <img
        class="app-logo"
        src="/assets/brand/logo-with-name-sidebar.png"
        width="600"
        height="150"
        alt="ResumeCrafts AI"
      />
      <img
        class="app-logo-short"
        src="/assets/brand/logo-icon-sidebar.png"
        width="512"
        height="512"
        alt="ResumeCrafts AI"
      />
    </div>
    <ul class="navigation">
      @for (link of links; track link.route) {
        <li
          class="navigation-item"
          [class.locked]="!isLinkAvailable(link)"
          [routerLink]="isLinkAvailable(link) ? link.route : null"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="onNavClick($event, link)"
          [attr.id]="link.id"
          [attr.aria-disabled]="!isLinkAvailable(link)"
          [attr.title]="!isLinkAvailable(link) ? 'Upgrade to Premium to use Job Tracker' : null"
        >
          <span class="material-symbols-outlined">{{ link.icon }}</span>
          <a class="navigation-link">{{ link.label }}</a>
          @if (!isLinkAvailable(link)) {
            <span class="material-symbols-outlined lock-icon" aria-hidden="true">lock</span>
          }
        </li>
      }
    </ul>
  </div>
  <div class="sidebar-account">
    <a
      class="navigation-item account-link"
      [routerLink]="settingsLink.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="liActive(settingsLink.id); isSidebarOpen = false"
      [attr.id]="settingsLink.id"
    >
      <span class="material-symbols-outlined">{{ settingsLink.icon }}</span>
      <span class="navigation-link">{{ settingsLink.label }}</span>
    </a>
  </div>
</div>

<nav class="mobile-tabs" aria-label="Application navigation">
  @for (link of mobileLinks(); track link.route) {
    <a
      class="mobile-tab"
      [class.locked]="!isLinkAvailable(link)"
      [routerLink]="isLinkAvailable(link) ? link.route : null"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="onNavClick($event, link)"
      [attr.aria-disabled]="!isLinkAvailable(link)"
      [attr.title]="!isLinkAvailable(link) ? 'Upgrade to Premium to use Job Tracker' : null"
    >
      <span class="material-symbols-outlined">{{ link.icon }}</span>
      <span class="mobile-tab-label">{{ link.label }}</span>
      @if (!isLinkAvailable(link)) {
        <span class="material-symbols-outlined lock-icon" aria-hidden="true">lock</span>
      }
    </a>
  }
</nav>
