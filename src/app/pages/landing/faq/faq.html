<section class="questions-section" id="faq">
    <div class="wrapper">
        <header class="head">
            <p class="section-kicker">FAQ</p>
            <h2 class="title">Questions, answered.</h2>
            <p class="sub-title">Practical details about templates, AI writing, privacy, and billing.</p>
        </header>
        <div class="qas">
            @for (question of qa; track $index; let even = $even; let odd = $odd) {
                <app-qa-item [qa]="question" class="qa" [isEven]="even" [isOdd]="odd"></app-qa-item>
            }
        </div>
    </div>
</section>
