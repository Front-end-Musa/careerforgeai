<section class="simple-steps" id="simple-steps" #simpleStepsRef>
  <div class="wrapper">
    <header class="head">
      <p class="section-kicker">The process</p>
      <h2 class="title">From blank page to ready-to-send</h2>
      <p class="sub-title">Build the resume or cover letter you need, then manage the next step.</p>
    </header>
    <div class="steps-grid">
        @for (step of steps; track step.id) {
            <app-step [step]="step"></app-step>
        }
    </div>
    <app-landing-cta
      class="section-cta"
      [link]="['/application/dashboard']"
      icon="arrow_forward"
      label="Start for Free"
      ariaLabel="Start for Free"
      ></app-landing-cta>
  </div>
</section>
