<div class="landing">
  <app-header [headerType]="'nav'"></app-header>
  <app-hero></app-hero>
  <app-features></app-features>
  @defer (on viewport) {
    <app-resume-templates></app-resume-templates>
  } @placeholder {
    <section class="defer-placeholder defer-placeholder-templates" aria-hidden="true"></section>
  }
  @defer (on viewport) {
    <app-simple-steps></app-simple-steps>
  } @placeholder {
    <section class="defer-placeholder defer-placeholder-steps" aria-hidden="true"></section>
  }
  @defer (on viewport) {
    <app-about></app-about>
  } @placeholder {
    <section class="defer-placeholder defer-placeholder-about" aria-hidden="true"></section>
  }
  @defer (on viewport) {
    <app-pricing-plans></app-pricing-plans>
  } @placeholder {
    <section class="defer-placeholder defer-placeholder-pricing" aria-hidden="true"></section>
  }
  @defer (on viewport) {
    <app-faq></app-faq>
  } @placeholder {
    <section class="defer-placeholder defer-placeholder-faq" aria-hidden="true"></section>
  }
  @defer (on viewport) {
    <app-contact></app-contact>
  } @placeholder {
    <section class="defer-placeholder defer-placeholder-contact" aria-hidden="true"></section>
  }
  @defer (on idle) {
    <app-footer></app-footer>
  } @placeholder {
    <section class="defer-placeholder defer-placeholder-footer" aria-hidden="true"></section>
  }
</div>
